<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients for N Swoosh -->
    <linearGradient id="nBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F54" />
      <stop offset="40%" stop-color="#0047AB" />
      <stop offset="80%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    
    <linearGradient id="cyanSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0096C7" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>

    <!-- Gradients for Bar Chart -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00A86B" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#76FF03" />
    </linearGradient>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001F54" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Group for Logo Icon -->
  <g transform="translate(40, 10)">
    <!-- 1. Rising Growth Bars on Right -->
    <rect x="268" y="160" width="22" height="110" rx="3" fill="url(#barGrad1)" />
    <rect x="298" y="130" width="22" height="140" rx="3" fill="url(#barGrad2)" />
    <rect x="328" y="100" width="22" height="170" rx="3" fill="url(#barGrad3)" />
    <rect x="358" y="65" width="22" height="205" rx="3" fill="url(#barGrad4)" />

    <!-- 2. Human Profile Silhouette (Right Facing in Navy) -->
    <path d="M 320 185
             C 345 185, 375 195, 385 220
             C 390 230, 395 238, 388 244
             C 382 248, 385 254, 392 258
             C 395 260, 388 266, 380 268
             C 382 274, 386 280, 378 285
             C 365 292, 345 300, 325 295
             C 305 290, 300 270, 300 245
             C 300 215, 308 185, 320 185 Z"
          fill="#001F54" />

    <!-- AI Neural Network Inside Human Silhouette -->
    <!-- Connecting Edges -->
    <line x1="328" y1="240" x2="345" y2="225" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="345" y1="225" x2="365" y2="235" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="328" y1="240" x2="335" y2="260" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="335" y1="260" x2="355" y2="268" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="345" y1="225" x2="355" y2="268" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="365" y1="235" x2="355" y2="268" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <line x1="345" y1="225" x2="335" y2="260" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Nodes (Circles) -->
    <circle cx="328" cy="240" r="5" fill="#FFFFFF" />
    <circle cx="345" cy="225" r="5" fill="#FFFFFF" />
    <circle cx="365" cy="235" r="5" fill="#FFFFFF" />
    <circle cx="335" cy="260" r="5" fill="#FFFFFF" />
    <circle cx="355" cy="268" r="6" fill="#FFFFFF" />

    <!-- 3. Dynamic Outer Cyan/Teal Arc Swoosh -->
    <path d="M 285 240
             C 330 200, 375 140, 388 95
             C 388 125, 365 195, 305 248
             Z"
          fill="url(#cyanSwoosh)" opacity="0.95" />

    <!-- 4. Main Letter 'N' Structure -->
    <!-- Left Column (Solid Navy) -->
    <path d="M 160 145
             L 205 145
             L 205 305
             L 160 305
             Z"
          fill="#001F54" />

    <!-- Sweeping Diagonal Swoosh of the 'N' -->
    <path d="M 160 145
             C 210 155, 270 215, 320 270
             C 345 295, 360 310, 370 312
             C 350 312, 310 285, 260 230
             C 225 192, 195 160, 160 145 Z"
          fill="url(#nBlueGrad)" />
    
    <!-- Fluid Bottom Curve Accent of N -->
    <path d="M 230 205
             C 275 255, 325 315, 370 312
             C 340 312, 290 280, 245 235
             C 240 230, 235 225, 230 205 Z"
          fill="#0047AB" opacity="0.85" />

    <!-- 5. Academic Graduation Cap (Mortarboard) -->
    <!-- Diamond Cap Top -->
    <polygon points="182,108 235,130 182,148 130,130" fill="#001F54" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="182,112 230,130 182,144 135,130" fill="#002D72" />
    
    <!-- Cap Base/Band -->
    <path d="M 155 137 Q 182 148 210 137 L 210 145 Q 182 156 155 145 Z" fill="#001A4D" />
    
    <!-- Button & Tassel -->
    <circle cx="182" cy="128" r="3.5" fill="#001A4D" />
    <!-- Tassel String dangling left -->
    <path d="M 182 128 C 160 130, 140 140, 138 160" stroke="#001A4D" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Tassel Fringe Knot -->
    <circle cx="138" cy="162" r="3" fill="#001A4D" />
    <polygon points="135,164 141,164 143,178 133,178" fill="#001A4D" />
  </g>

  <!-- Typography & Taglines -->
  <!-- N I P U N Main Logotype -->
  <g id="logotype" transform="translate(0, 30)">
    <!-- Letter N -->
    <path d="M 85 410 L 85 345 L 105 345 L 135 390 L 135 345 L 152 345 L 152 410 L 132 410 L 102 365 L 102 410 Z" fill="#001F54" />
    
    <!-- Letter I (With Green Dot) -->
    <path d="M 195 365 L 195 410 L 178 410 L 178 365 Z" fill="#001F54" />
    <!-- Green Accent on I -->
    <polygon points="178,345 195,345 195,357 178,357" fill="#00C853" />

    <!-- Letter P -->
    <path d="M 225 410 L 225 345 L 255 345 C 272 345, 280 353, 280 366 C 280 379, 272 387, 255 387 L 242 387 L 242 410 Z M 242 373 L 253 373 C 260 373, 263 370, 263 366 C 263 362, 260 359, 253 359 L 242 359 Z" fill="#001F54" />

    <!-- Letter U -->
    <path d="M 310 345 L 327 345 L 327 385 C 327 395, 333 400, 342 400 C 351 400, 357 395, 357 385 L 357 345 L 374 345 L 374 385 C 374 402, 362 412, 342 412 C 322 412, 310 402, 310 385 Z" fill="#001F54" />

    <!-- Letter N -->
    <path d="M 405 410 L 405 345 L 425 345 L 455 390 L 455 345 L 472 345 L 472 410 L 452 410 L 422 365 L 422 410 Z" fill="#001F54" />
  </g>

  <!-- Subtitle: LEARN • GROW • EXCEL -->
  <g transform="translate(0, 480)">
    <!-- Thin Decorative Border Lines -->
    <line x1="140" y1="-25" x2="265" y2="-25" stroke="#001F54" stroke-width="1.5" opacity="0.35" />
    <circle cx="280" cy="-25" r="4.5" fill="#00C853" />
    <line x1="295" y1="-25" x2="420" y2="-25" stroke="#001F54" stroke-width="1.5" opacity="0.35" />

    <text x="280" y="0" 
          font-family="'Public Sans', 'Inter', -apple-system, sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="5.5" 
          fill="#001F54" 
          text-anchor="middle">
      LEARN   <tspan fill="#00C853" font-size="14" font-weight="900">•</tspan>   GROW   <tspan fill="#00C853" font-size="14" font-weight="900">•</tspan>   EXCEL
    </text>
  </g>

  <!-- Tagline: AI-POWERED COMPETENCY INTELLIGENCE PLATFORM -->
  <g transform="translate(0, 525)">
    <line x1="80" y1="-5" x2="135" y2="-5" stroke="#8E9099" stroke-width="1.2" opacity="0.6" />
    <text x="280" y="0" 
          font-family="'Public Sans', 'Inter', -apple-system, sans-serif" 
          font-size="11.5" 
          font-weight="700" 
          letter-spacing="2.2" 
          fill="#44474E" 
          text-anchor="middle">
      AI-POWERED COMPETENCY INTELLIGENCE PLATFORM
    </text>
    <line x1="425" y1="-5" x2="480" y2="-5" stroke="#8E9099" stroke-width="1.2" opacity="0.6" />
  </g>
</svg>
